<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle da Horta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1><span>🌱</span> Controle Horta</h1>
        <div id="system-status" class="status-badge">
            <div class="dot"></div>
            <span id="status-text">Conectando...</span>
        </div>
    </header>

    <main>
        <!-- Seção de Login -->
        <div id="login-section">
            <label for="passwordInput">Senha de Acesso:</label>
            <input type="password" id="passwordInput" placeholder="Digite a senha...">
            <button id="loginBtn">Entrar 🔐</button>
        </div>

        <!-- Seção de Controle -->
        <div id="control-section" style="display: none;">
            <div class="command-section">
                <label for="durationInput">Duração (segundos):</label>
                <input type="number" id="durationInput" value="10" min="1" max="3600">
                <button id="executeBtn" class="action-btn">Ligar Horta 🌱</button>
                <button id="stopBtn" class="action-btn stop-btn" disabled>Parar Horta 🛑</button>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="openHistoryBtn" style="background: #333; font-size: 0.9rem;">Ver Histórico 📋</button>
                <button id="logoutBtn" style="background: transparent; color: #888; font-size: 0.8rem; border: 1px solid #444; width: auto; padding: 0 20px;">Sair</button>
            </div>
        </div>

        <div id="responseOutput" class="response-area"></div>
    </main>
</div>

<!-- Modal de Histórico -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Histórico (7 dias)</h2>
            <button id="closeHistoryBtn" class="close-modal-btn">&times;</button>
        </div>
        <div id="historyList" class="history-list">
            <p style="color: #666; text-align: center; margin-top: 20px;">Carregando...</p>
        </div>
        <button id="refreshHistoryBtn" style="margin-top: 15px; background: #222; font-size: 0.8rem; padding: 0.8rem;">Atualizar 🔄</button>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
